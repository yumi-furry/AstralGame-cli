[package]
name = "astral-server"
version = "1.4.1"
edition = "2021"
description = "Astral Game P2P server (headless) with embedded web management"
license = "MIT"

[[bin]]
name = "astral-server"
path = "src/main.rs"

[dependencies]
# Astral 的 EasyTier fork（含 astral_app_rpc / 凭据管理 / secure_mode 处理）
easytier = { git = "https://github.com/ldoubil/EasyTier.git", rev = "d76c8db55613800f9d8064af7504e80e921968d8" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
base64 = "0.22"
uuid = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true