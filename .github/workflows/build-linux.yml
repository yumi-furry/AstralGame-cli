# CI：为 amd64（Ubuntu / Debian 系列）编译 release 二进制并打包 .deb，
# 推送 v* 标签时额外创建 GitHub Release（资产即在线更新检查的下载来源）。
name: Build Linux binaries & deb packages

on:
  push:
    tags:
      - 'v*'          # 打标签即发布（触发 release 作业）
  workflow_dispatch:  # 也支持 Actions 页面手动触发（只构建不上架 Release）

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.arch }})
    # 必须用 ubuntu-22.04：生产机为 Ubuntu 22.04（glibc 2.35），
    # ubuntu-latest 已升级到 24.04（glibc 2.39），产物在旧机器上无法运行。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false   # 单一架构无需 fail-fast（保留注释语义）
      matrix:
        # 仅构建 amd64：生产环境只支持 Ubuntu 系列（x86_64），无需 arm64。
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          # protoc（easytier 用 prost/tonic-build 编译 proto 需要）与 C 编译器
          sudo apt-get install -y build-essential protobuf-compiler pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          # 缓存 crate 源、git 依赖与编译产物；Cargo.lock 变动则缓存失效。
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Assemble deb package
        # 复用本地打deb脚本（此时二进制已存在，脚本会跳过编译直接打包）。
        run: bash deploy/build-deb.sh ${{ matrix.arch }} ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # artifact 内含裸二进制、.deb 与命名合规的在线更新二进制。
          name: astral-server-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/astral-server
            dist/*.deb
            dist/astral-server-linux-*

  release:
    name: create GitHub release
    # 仅标签推送执行；手动触发不创建 Release。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release 上传资产需要写权限
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        # 全部产物（amd64 二进制 + .deb + 在线更新裸二进制）递归上传到该 tag 的 Release。
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
